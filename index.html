const PHASES = [
  { id: 1, name: "Phase 1: 基底建設", range: "4月 – 5月中", color: "#4A90D9" },
  { id: 2, name: "Phase 2: 深化與整合", range: "5月中 – 6月底", color: "#D4A03C" },
  { id: 3, name: "Phase 3: 面試備戰", range: "7月", color: "#C0392B" },
];

const DAY_NAMES = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
const DAY_NAMES_EN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function getPhase(date) {
  const m = date.getMonth(), d = date.getDate();
  if (m === 3 || (m === 4 && d <= 15)) return 1;
  if ((m === 4 && d > 15) || m === 5) return 2;
  if (m === 6) return 3;
  return 1;
}

function getWeekDates(baseDate) {
  const d = new Date(baseDate);
  const day = d.getDay();
  const monday = new Date(d);
  monday.setDate(d.getDate() - ((day + 6) % 7));
  monday.setHours(0, 0, 0, 0);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const date = new Date(monday);
    date.setDate(monday.getDate() + i);
    dates.push(date);
  }
  return dates;
}

function dateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function getDaySchedule(date, phase) {

      { time: "09:30–10:30", task: "運動 1hr", cat: "fitness" },
      { time: "10:30–11:00", task: "本週 Review：產業筆記整理 + 進度確認", cat: "review" },
      { time: "11:00–12:30", task: gpaNote, cat: "gpa" },
      { time: "12:30–13:30", task: "午餐 + 休息", cat: "life" },

      { time: "17:30–19:00", task: p <= 2 ? "產業閱讀 / Modeling 練習（Phase 2+）" : "面試準備：Behavioral Q + Market view 整理", cat: "industry" },
      { time: "19:00–20:00", task: "晚餐", cat: "life" },
      { time: "20:00–21:30", task: eveningFlex, cat: "english" },
      { time: "21:30–22:30", task: p <= 2 ? "產業閱讀 / 公司研究" : "Mock interview 練習", cat: "industry" },
      { time: "22:30–23:00", task: "下週計畫排定", cat: "review" },
      { time: "23:00–00:30", task: "彈性：閱讀 / 放鬆 / 補進度", cat: "flex" },
      { time: "01:00", task: "就寢", cat: "life" },
    ],
    1: [ // 週一 — 整天實習
      { time: "08:00–09:00", task: "起床 + 通勤到公司 1hr（聽英文 podcast / Bloomberg）", cat: "english" },

      { time: "21:00–22:00", task: "運動 1hr", cat: "fitness" },
      { time: "22:00–22:30", task: "盥洗 + 休息", cat: "life" },
      { time: "22:30–00:00", task: eveningFlex + " + 產業閱讀", cat: "english" },
      { time: "00:00–00:30", task: "放鬆 / 收信整理", cat: "life" },
      { time: "01:00", task: "就寢", cat: "life" },
    ],
    2: [ // 週二 — 整天實習
      { time: "08:00–09:00", task: "起床 + 通勤到公司 1hr（聽英文 podcast / Bloomberg）", cat: "english" },
      { time: "09:00–12:00", task: "實習｜空檔 → 產業閱讀（Tier 2: Healthcare / Consumer）", cat: "intern" },

      { time: "22:30–00:00", task: p <= 2 ? "產業閱讀 / 公司研究" : "面試技術題刷題", cat: "industry" },

      { time: "09:00–12:00", task: "實習｜空檔 → 快速產業新聞 scan（LSEG / Quartr）", cat: "intern" },
      { time: "12:00–13:00", task: "午餐 + 通勤到學校 1hr", cat: "life" },
      { time: "13:00–17:30", task: `上課 + 課間空檔 → ${gpaNote}（平日最大學業 block）`, cat: "gpa" },
      { time: "17:40–18:40", task: "🎓 英文家教 Tutor（固定）", cat: "tutor" },
      { time: "18:40–19:30", task: "晚餐 + 休息", cat: "life" },
      { time: "19:30–21:00", task: gpaNote, cat: "gpa" },
      { time: "21:00–22:00", task: "運動 1hr", cat: "fitness" },
      { time: "22:00–22:30", task: "盥洗 + 休息", cat: "life" },
      { time: "22:30–00:00", task: "英文口說練習 20min + 產業閱讀", cat: "english" },
      { time: "00:00–00:30", task: "放鬆", cat: "life" },
      { time: "01:00", task: "就寢", cat: "life" },
    ],
    4: [ // 週四 — 上午上課，下午實習
      { time: "08:00–09:00", task: "起床 + 通勤到學校 1hr（聽英文 podcast）", cat: "english" },
      { time: "09:00–12:00", task: `上課 + 課間 → ${gpaNote}`, cat: "gpa" },
      { time: "12:00–13:00", task: "午餐 + 通勤到公司 1hr", cat: "life" },
      { time: "13:00–18:00", task: "實習｜空檔 → 整理本週產業筆記 / 寫 Weekly Industry Note", cat: "intern" },
      { time: "18:00–19:00", task: "通勤回學校 1hr", cat: "life" },
      { time: "19:00–21:00", task: `涼課時間 → ${gpaNote}`, cat: "gpa" },
      { time: "21:00–22:00", task: "運動 1hr", cat: "fitness" },
      { time: "22:00–22:30", task: "盥洗 + 休息", cat: "life" },
      { time: "22:30–00:00", task: eveningFlex + " + 產業閱讀", cat: "english" },
      { time: "00:00–00:30", task: "放鬆", cat: "life" },
      { time: "01:00", task: "就寢", cat: "life" },
    ],
    5: [ // 週五 — 整天實習
      { time: "08:00–09:00", task: "起床 + 通勤到公司 1hr（聽英文 podcast / Bloomberg）", cat: "english" },
      { time: "09:00–12:00", task: `實習｜空檔 → ${p === 1 ? "產業深讀日（挑一篇長報告精讀）" : p === 2 ? "Deal case study 深讀 / Modeling" : "面試模擬準備"}`, cat: "intern" },
      { time: "12:00–13:00", task: "午餐", cat: "life" },
      { time: "13:00–18:00", task: "實習｜空檔 → 續深讀 / 公司研究", cat: "intern" },
      { time: "18:00–19:00", task: "通勤到學校 1hr", cat: "life" },
      { time: "19:00–21:00", task: `涼課 → ${gpaNote} / 彈性（社交休息亦可）`, cat: "gpa" },
      { time: "21:00–22:00", task: "運動 1hr", cat: "fitness" },
      { time: "22:00–22:30", task: "盥洗 + 休息", cat: "life" },
      { time: "22:30–00:00", task: eveningFlex + " + 本週覆盤", cat: "english" },
      { time: "00:00–00:30", task: "放鬆", cat: "life" },
      { time: "01:00", task: "就寢", cat: "life" },
    ],
    6: [ // 週六
      { time: "09:00–09:30", task: "起床 + 準備", cat: "life" },
      { time: "09:30–12:30", task: `${gpaNote}（主力衝刺 3hr）`, cat: "gpa" },
      { time: "12:30–13:30", task: "午餐", cat: "life" },
      { time: "13:30–14:30", task: "運動 1hr", cat: "fitness" },
      { time: "14:30–17:00", task: p <= 2 ? "產業深度閱讀 / Investment thesis 整理" : "Mock interview + Pitch 打磨", cat: "industry" },
      { time: "17:00–17:30", task: "英文口說練習（錄音）", cat: "english" },
      { time: "17:30–19:00", task: "彈性：社交 / 休息 / 補進度", cat: "flex" },
      { time: "19:00–20:00", task: "晚餐", cat: "life" },
      { time: "20:00–22:00", task: p >= 2 ? "Modeling 練習 / Deal structure 研究" : "產業閱讀 / 公司研究", cat: "industry" },
      { time: "22:00–00:00", task: `${gpaNote} / 彈性學習`, cat: "gpa" },
      { time: "00:00–00:30", task: "放鬆", cat: "life" },
      { time: "01:00", task: "就寢", cat: "life" },
    ],
  };
  return blocks[dow] || blocks[0];
}

const CAT_STYLES = {
  gpa: { bg: "#1a2744", border: "#2d4a7a", icon: "📚", label: "GPA" },
  english: { bg: "#1a3a2a", border: "#2a6644", icon: "🗣️", label: "英文" },
  industry: { bg: "#2a2215", border: "#5a4a22", icon: "📊", label: "產業" },
  intern: { bg: "#1a1a2e", border: "#3a3a5e", icon: "💼", label: "實習" },
  fitness: { bg: "#2a1525", border: "#5a2a4a", icon: "🏃", label: "運動" },
  tutor: { bg: "#0d2a2a", border: "#1a5555", icon: "🎓", label: "家教" },
  life: { bg: "#1a1a1a", border: "#333", icon: "☕", label: "生活" },
  review: { bg: "#2a2010", border: "#554422", icon: "📝", label: "覆盤" },
  flex: { bg: "#1f1a2e", border: "#3f3a5e", icon: "✨", label: "彈性" },
};

// localStorage helpers
function loadChecked() {
  try {
    const raw = localStorage.getItem("ib-prep-checked");
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function saveCheckedData(data) {
  try { localStorage.setItem("ib-prep-checked", JSON.stringify(data)); } catch {}
}

function ProgressRing({ pct, size = 44, stroke = 3 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#222" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={pct >= 100 ? "#4CAF50" : "#D4A03C"}
        strokeWidth={stroke} strokeDasharray={c} strokeDashoffset={c * (1 - pct / 100)}
        strokeLinecap="round" style={{ transition: "stroke-dashoffset 0.5s ease" }} />
    </svg>
  );
}

function App() {
  const [currentWeekStart, setCurrentWeekStart] = useState(() => {
    const now = new Date();
    const day = now.getDay();
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((day + 6) % 7));
    monday.setHours(0, 0, 0, 0);
    return monday;
  });
  const [selectedDay, setSelectedDay] = useState(new Date());
  const [checked, setChecked] = useState(loadChecked);
  const [streakDays, setStreakDays] = useState(0);

  const weekDates = useMemo(() => getWeekDates(currentWeekStart), [currentWeekStart]);

  const saveChecked = useCallback((newChecked) => {
    setChecked(newChecked);
    saveCheckedData(newChecked);
  }, []);

  useEffect(() => {
    let streak = 0;
    const today = new Date();
    for (let i = 0; i < 120; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const dk = dateKey(d);
      const phase = getPhase(d);
      const sched = getDaySchedule(d, phase);
      const actionable = sched.filter(b => b.cat !== "life");
      if (actionable.length === 0) continue;
      const done = actionable.filter(b => checked[`${dk}-${b.time}`]).length;
      if (done >= actionable.length * 0.7) streak++;
      else if (i > 0) break;
    }
    setStreakDays(streak);
  }, [checked]);

  const navigate = (dir) => {
    const next = new Date(currentWeekStart);
    next.setDate(next.getDate() + dir * 7);
    setCurrentWeekStart(next);
    const sd = new Date(next);
    sd.setDate(next.getDate() + ((selectedDay.getDay() + 6) % 7));
    setSelectedDay(sd);
  };

  const toggleCheck = (dk, time) => {
    const key = `${dk}-${time}`;
    const next = { ...checked, [key]: !checked[key] };
    saveChecked(next);
  };

  const phase = getPhase(selectedDay);
  const schedule = getDaySchedule(selectedDay, phase);
  const dk = dateKey(selectedDay);
  const actionable = schedule.filter(b => b.cat !== "life");
  const doneCount = actionable.filter(b => checked[`${dk}-${b.time}`]).length;
  const dayPct = actionable.length > 0 ? Math.round((doneCount / actionable.length) * 100) : 0;

  const weekStats = weekDates.map(d => {
    const p = getPhase(d);
    const s = getDaySchedule(d, p);
    const act = s.filter(b => b.cat !== "life");
    const done = act.filter(b => checked[`${dateKey(d)}-${b.time}`]).length;
    return { date: d, total: act.length, done, pct: act.length > 0 ? Math.round((done / act.length) * 100) : 0 };
  });
  const weekPct = weekStats.reduce((a, s) => a + s.done, 0) / Math.max(1, weekStats.reduce((a, s) => a + s.total, 0)) * 100;

  const phaseObj = PHASES.find(p => p.id === phase) || PHASES[0];
  const isToday = (d) => dateKey(d) === dateKey(new Date());

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0f" }}>
      {/* Header */}
      <div style={{
        background: "linear-gradient(135deg, #0d1117 0%, #111827 50%, #0d1117 100%)",
        borderBottom: "1px solid #1a1f2e", padding: "24px 20px 20px",
        position: "sticky", top: 0, zIndex: 100
      }}>
        <div style={{ maxWidth: 720, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
            <div>
              <h1 style={{
                fontSize: 22, fontWeight: 700, margin: 0, letterSpacing: "-0.5px",
                background: "linear-gradient(135deg, #D4A03C, #F0C060)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent"
              }}>
                HK IB Prep Tracker
              </h1>
              <div style={{ fontSize: 12, color: "#666", marginTop: 4, fontFamily: "'DM Mono', monospace" }}>
                APR — JUL 2026
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{
                display: "inline-block", padding: "4px 12px", borderRadius: 20,
                background: phaseObj.color + "22", border: `1px solid ${phaseObj.color}44`,
                fontSize: 11, fontWeight: 600, color: phaseObj.color, letterSpacing: "0.5px"
              }}>
                {phaseObj.name}
              </div>
              <div style={{ fontSize: 10, color: "#555", marginTop: 4 }}>{phaseObj.range}</div>
            </div>
          </div>

          {/* Stats */}
          <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
            {[
              { label: "今日", value: `${dayPct}%`, sub: `${doneCount}/${actionable.length}` },
              { label: "本週", value: `${Math.round(weekPct)}%`, sub: "完成率" },
              { label: "連續", value: `${streakDays}`, sub: "天達標" },
            ].map((s, i) => (
              <div key={i} style={{
                flex: 1, background: "#111520", border: "1px solid #1a2030", borderRadius: 10, padding: "10px 12px", textAlign: "center"
              }}>
                <div style={{ fontSize: 10, color: "#666", marginBottom: 2, fontFamily: "'DM Mono', monospace" }}>{s.label}</div>
                <div style={{ fontSize: 20, fontWeight: 700, color: "#e8e8e8" }}>{s.value}</div>
                <div style={{ fontSize: 10, color: "#555" }}>{s.sub}</div>
              </div>
            ))}
          </div>

          {/* Week nav */}
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button onClick={() => navigate(-1)} style={{
              background: "#151a28", border: "1px solid #222", borderRadius: 8, color: "#888",
              width: 36, height: 36, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center"
            }}>←</button>
            <div style={{ flex: 1, display: "flex", gap: 4 }}>
              {weekDates.map((d, i) => {
                const sel = dateKey(d) === dateKey(selectedDay);
                const today = isToday(d);
                const ws = weekStats[i];
                return (
                  <button key={i} onClick={() => setSelectedDay(d)} style={{
                    flex: 1, background: sel ? "#1a2744" : "transparent",
                    border: sel ? "1px solid #2d4a7a" : today ? "1px solid #333" : "1px solid transparent",
                    borderRadius: 8, padding: "8px 2px", cursor: "pointer", transition: "all 0.2s",
                    display: "flex", flexDirection: "column", alignItems: "center", gap: 3
                  }}>
                    <span style={{ fontSize: 10, color: sel ? "#7ab0e8" : "#555", fontFamily: "'DM Mono', monospace" }}>
                      {DAY_NAMES_EN[d.getDay()]}
                    </span>
                    <span style={{ fontSize: 15, fontWeight: sel ? 700 : 400, color: sel ? "#fff" : today ? "#D4A03C" : "#888" }}>
                      {d.getDate()}
                    </span>
                    <div style={{ width: 22, height: 3, borderRadius: 2, background: "#222", overflow: "hidden" }}>
                      <div style={{
                        width: `${ws.pct}%`, height: "100%", borderRadius: 2,
                        background: ws.pct >= 100 ? "#4CAF50" : ws.pct > 50 ? "#D4A03C" : "#555",
                        transition: "width 0.3s"
                      }} />
                    </div>
                  </button>
                );
              })}
            </div>
            <button onClick={() => navigate(1)} style={{
              background: "#151a28", border: "1px solid #222", borderRadius: 8, color: "#888",
              width: 36, height: 36, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center"
            }}>→</button>
          </div>

          {/* Jump to today */}
          {!isToday(selectedDay) && (
            <button onClick={() => {
              const now = new Date();
              setSelectedDay(now);
              const day = now.getDay();
              const mon = new Date(now);
              mon.setDate(now.getDate() - ((day + 6) % 7));
              mon.setHours(0,0,0,0);
              setCurrentWeekStart(mon);
            }} style={{
              display: "block", width: "100%", marginTop: 8, padding: "6px",
              background: "#D4A03C11", border: "1px solid #D4A03C33", borderRadius: 8,
              color: "#D4A03C", fontSize: 11, fontWeight: 600, cursor: "pointer", textAlign: "center"
            }}>
              ← 回到今天
            </button>
          )}
        </div>
      </div>

      {/* Day schedule */}
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "16px 20px 60px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div>
            <span style={{ fontSize: 17, fontWeight: 600 }}>
              {selectedDay.getMonth() + 1}/{selectedDay.getDate()} {DAY_NAMES[selectedDay.getDay()]}
            </span>
            {isToday(selectedDay) && (
              <span style={{
                marginLeft: 8, fontSize: 10, padding: "2px 8px", borderRadius: 10,
                background: "#D4A03C22", color: "#D4A03C", fontWeight: 600
              }}>TODAY</span>
            )}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <ProgressRing pct={dayPct} size={38} stroke={3} />
            <span style={{ fontSize: 14, color: "#888", fontFamily: "'DM Mono', monospace" }}>{dayPct}%</span>
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {schedule.map((block, i) => {
            const cat = CAT_STYLES[block.cat] || CAT_STYLES.life;
            const key = `${dk}-${block.time}`;
            const done = checked[key];
            const isLife = block.cat === "life";
            return (
              <div key={i} onClick={() => !isLife && toggleCheck(dk, block.time)} style={{
                display: "flex", alignItems: "flex-start", gap: 12,
                background: done ? "#0a1a0a" : cat.bg,
                border: `1px solid ${done ? "#1a3a1a" : cat.border}`,
                borderRadius: 10, padding: "12px 14px",
                cursor: isLife ? "default" : "pointer",
                opacity: done ? 0.55 : 1,
                transition: "all 0.2s",
                WebkitUserSelect: "none", userSelect: "none"
              }}>
                <div style={{
                  minWidth: 82, fontSize: 11, color: "#666",
                  fontFamily: "'DM Mono', monospace", paddingTop: 1, flexShrink: 0
                }}>
                  {block.time}
                </div>
                {!isLife ? (
                  <div style={{
                    width: 22, height: 22, borderRadius: 6, flexShrink: 0, marginTop: 0,
                    border: done ? "2px solid #4CAF50" : "2px solid #333",
                    background: done ? "#4CAF5022" : "transparent",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    transition: "all 0.2s"
                  }}>
                    {done && <span style={{ fontSize: 13, color: "#4CAF50" }}>✓</span>}
                  </div>
                ) : (
                  <div style={{ width: 22, flexShrink: 0, textAlign: "center" }}><span style={{ fontSize: 14 }}>{cat.icon}</span></div>
                )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{
                    fontSize: 13, fontWeight: 500, lineHeight: 1.55,
                    textDecoration: done ? "line-through" : "none",
                    color: done ? "#555" : "#d0d0d0"
                  }}>
                    {block.task}
                  </div>
                </div>
                {!isLife && (
                  <div style={{
                    fontSize: 9, padding: "2px 8px", borderRadius: 10,
                    background: cat.border + "33", color: cat.border,
                    fontWeight: 600, letterSpacing: "0.5px", flexShrink: 0, marginTop: 3, whiteSpace: "nowrap"
                  }}>
                    {cat.label}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Phase roadmap */}
        <div style={{
          marginTop: 24, padding: "16px", background: "#111520",
          border: "1px solid #1a2030", borderRadius: 12
        }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: "#666", marginBottom: 10, letterSpacing: "1px", fontFamily: "'DM Mono', monospace" }}>
            PHASE ROADMAP
          </div>
          {PHASES.map(p => (
            <div key={p.id} style={{
              display: "flex", alignItems: "center", gap: 10, padding: "8px 0",
              borderBottom: p.id < 3 ? "1px solid #1a1a22" : "none",
              opacity: phase === p.id ? 1 : 0.4
            }}>
              <div style={{
                width: 8, height: 8, borderRadius: "50%", background: p.color, flexShrink: 0,
                boxShadow: phase === p.id ? `0 0 8px ${p.color}88` : "none"
              }} />
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: p.color }}>{p.name}</div>
                <div style={{ fontSize: 10, color: "#555" }}>{p.range}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Legend */}
        <div style={{
          marginTop: 12, padding: "12px 16px", background: "#111520",
          border: "1px solid #1a2030", borderRadius: 12,
          display: "flex", flexWrap: "wrap", gap: 10
        }}>
          {Object.entries(CAT_STYLES).filter(([k]) => k !== "life").map(([k, v]) => (
            <div key={k} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, color: "#666" }}>
              <span>{v.icon}</span><span>{v.label}</span>
            </div>
          ))}
        </div>

        {/* Reset */}
        <div style={{ marginTop: 24, textAlign: "center" }}>
          <button onClick={() => {
            if (confirm("確定要清除所有打勾紀錄嗎？")) {
              saveChecked({});
            }
          }} style={{
            background: "transparent", border: "1px solid #222", borderRadius: 8,
            color: "#444", fontSize: 11, padding: "8px 20px", cursor: "pointer"
          }}>
            重置所有紀錄
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
